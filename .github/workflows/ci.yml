
name: BeenThere CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HACS integration
        uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare temporary integration structure
        run: |
          mkdir -p /tmp/beenthere-stage/custom_components/beenthere
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='tests/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='*.pyc' \
            ./ /tmp/beenthere-stage/custom_components/beenthere/
          mkdir -p custom_components/beenthere
          cp -a /tmp/beenthere-stage/custom_components/beenthere/. \
            custom_components/beenthere/

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for path in Path(".").rglob("*.py"):
              if any(part.startswith(".") for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("Python syntax checks passed")
          PY
